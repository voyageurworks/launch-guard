name: macOS

# The same checks as CI, on macOS. Not part of CI and not a required check: GitHub often never assigns a macOS runner,
# and a job that never starts marked every push to main as failed. It still runs on every pull request, weekly and on
# demand, so macOS is attempted on every change and a gap shows up on the pull request instead of going unseen.
# Before a release, run it by hand on the release commit (Actions tab, "Run workflow") and record the result, or the
# gap, in the release notes (docs/releasing.md). A job cancelled with "not acquired by Runner of type hosted" is a runner
# shortage, not a code failure: re-run it by hand later, never in a loop.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

# A stale run must never sit in the macOS queue and keep the newest one waiting.
concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests create throwaway git repositories, so give git a neutral identity.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Committed skill bundle is up to date
        run: git diff --exit-code -- skill/launch-guard.mjs
