name: macOS

# The same checks as CI, on macOS. Not part of CI, not a required check and not run on every push: GitHub often never
# assigns a macOS runner, and a job that never starts would mark every push as failed. Runs once a week and on demand
# (Actions tab, "Run workflow"); when a runner is available the result shows here.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  # Tests create throwaway git repositories, so give git a neutral identity.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Committed skill bundle is up to date
        run: git diff --exit-code -- skill/launch-guard.mjs
