name: macOS

# The same checks as CI, on macOS, plus a real-user smoke test: Intel (macos-15-intel) and Apple silicon (macos-15, arm64)
# on Node 22 and 24, and the newest macOS (macos-26, arm64) on Node 24. "macOS passed" means the tool works on a real Mac:
# every job also packs the project, installs the tarball into a clean folder and runs the installed command
# (scripts/smoke-user.mjs).
#
# Not part of the push CI. GitHub's macOS pools are sometimes short of runners, and a job that never starts marked every
# push to main as failed. This workflow runs on pull requests, weekly and on demand, never on pushes to main.
#
# The ONE required check is "macOS result" (the last job), which runs on an ordinary Linux runner so it always starts:
#   - a macOS job that ran and FAILED  -> "macOS result" fails and the merge is blocked;
#   - no macOS job ran (no runner)     -> it passes with a loud warning and a job summary saying macOS was NOT verified,
#                                         so a runner shortage never forces an administrator override;
#   - some passed, some did not run    -> it passes and lists what did not run.
# Logic and tests: scripts/macos-gate.mjs, src/macosGate.test.ts. If you rename "macOS result", update the required checks
# of main too, or pull requests will wait for a check that never appears.
#
# Before a release, run this workflow by hand on the release commit (Actions tab, "Run workflow") and record the result, or
# the gap, in the release notes (docs/releasing.md). A job cancelled with "not acquired by Runner of type hosted" is a
# runner shortage, not a code failure: re-run it by hand later, never in a loop.
#
# Checked on 2026-11-03: macos-14, macos-15 and macos-26 (arm64) and macos-15-intel each ran the whole suite and passed at
# least once, but availability changes by label and by minute (macos-15 had no runner for 15 minutes while macos-26 started
# at once, ten minutes after the reverse). `macos-latest` is avoided on purpose: it is macos-26-arm64, the label cancelled most.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

# A stale run must never sit in the macOS queue and keep the newest one waiting.
concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests create throwaway git repositories, so give git a neutral identity.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  check:
    name: macOS ${{ matrix.arch }} (Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, arch: x64, node: 22 }
          - { os: macos-15-intel, arch: x64, node: 24 }
          - { os: macos-15, arch: arm64, node: 22 }
          - { os: macos-15, arch: arm64, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Which machine this is
        run: uname -m && sw_vers
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Committed skill bundle is up to date
        run: git diff --exit-code -- skill/launch-guard.mjs
      - name: Real-user smoke test (pack, install the tarball, run the installed command)
        run: node scripts/smoke-user.mjs

  # The newest macOS, Apple silicon. Its pool queued for about seven minutes before it started in the 2026-11-03 test.
  # continue-on-error keeps it from failing the workflow run by itself; "macOS result" still counts a real failure.
  latest:
    name: macOS latest (macos-26, arm64, Node 24)
    continue-on-error: true
    timeout-minutes: 20
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Which machine this is
        run: uname -m && sw_vers
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Committed skill bundle is up to date
        run: git diff --exit-code -- skill/launch-guard.mjs
      - name: Real-user smoke test (pack, install the tarball, run the installed command)
        run: node scripts/smoke-user.mjs

  # The required check. Runs on Linux, so it always starts, and decides from what the macOS jobs above really did.
  result:
    name: macOS result
    needs: [check, latest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: What the macOS jobs did
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate --jq '.jobs[] | {name: .name, conclusion: .conclusion}' > jobs.ndjson
          node scripts/macos-gate.mjs jobs.ndjson
