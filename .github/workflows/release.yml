name: Release

# Publishes to npm when a GitHub release is published. Uses npm trusted publishing (OIDC):
# no npm token is stored anywhere. Set up once on npmjs.com (see docs/releasing.md).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  # Tests create throwaway git repositories, so give git a neutral identity.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  publish:
    # Prereleases are never published to npm.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The release tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # The first version is published by hand (trusted publishing needs an existing package). A release for it must not
      # fail: when npm already has this exact version, say so and skip every step below. A failed lookup counts as "not published".
      - name: Is this version already on npm?
        id: published
        run: |
          if npm view "@voyageurworks/launch-guard@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This version is already on npm (published by hand), so there is nothing to publish."
          fi
      - name: npm must be new enough for trusted publishing (11.5.1 or later)
        if: steps.published.outputs.already != 'true'
        run: |
          node -e "const v=process.argv[1].trim().split('.').map(Number),m=[11,5,1];let ok=true;for(let i=0;i<3;i++){if(v[i]!==m[i]){ok=v[i]>m[i];break}}if(!ok){console.error('npm '+process.argv[1].trim()+' is older than 11.5.1; npm trusted publishing needs 11.5.1 or later.');process.exit(1)}" "$(npm --version)"
      - name: Install pnpm
        if: steps.published.outputs.already != 'true'
        run: npm install --global pnpm@10
      - name: Install dependencies
        if: steps.published.outputs.already != 'true'
        run: pnpm install --frozen-lockfile
      - name: Type check
        if: steps.published.outputs.already != 'true'
        run: pnpm check
      - name: Build
        if: steps.published.outputs.already != 'true'
        run: pnpm build
      - name: Test
        if: steps.published.outputs.already != 'true'
        run: pnpm test
      - name: Committed skill bundle is up to date
        if: steps.published.outputs.already != 'true'
        run: git diff --exit-code -- skill/launch-guard.mjs
      - name: Publish to npm with provenance
        if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
