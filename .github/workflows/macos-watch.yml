name: macOS runner watch

# Since 2026-11-02 GitHub has not given this organization any macOS runner, so the macOS jobs in CI never start
# (docs: see the repository owner's macos-runner-investigation notes). This workflow checks once an hour whether
# one job can get a macOS runner. If it can, it re-runs main's CI, so the macOS checks are retried without anyone
# running anything by hand. It is cheap: one tiny job per hour, one at a time.
# Delete this file once macOS jobs in CI run normally again.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# No permissions unless a job asks for them.
permissions: {}

# Never more than one probe waiting: a new run replaces a pending one instead of queuing behind it.
concurrency:
  group: macos-watch
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'voyageurworks/launch-guard'
    runs-on: macos-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: A macOS runner was assigned
        run: uname -a

  recover:
    # Runs only when the probe really ran on macOS and succeeded.
    needs: probe
    if: needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-run main's CI if its latest run was cancelled or failed
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status) \(.conclusion)"')"
          if [ -z "$run" ]; then
            echo "main's head ($sha) has no CI run; nothing to re-run."
            exit 0
          fi
          read -r id status conclusion <<<"$run"
          case "$status/$conclusion" in
            completed/cancelled|completed/failure)
              echo "CI run $id for main's head was $status/$conclusion; re-running its failed and cancelled jobs."
              gh run rerun "$id" --failed
              ;;
            *)
              echo "CI run $id for main's head is $status/$conclusion; leaving it alone."
              ;;
          esac
